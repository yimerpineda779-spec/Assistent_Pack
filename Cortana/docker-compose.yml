name: cortana

services:
  # El "cerebro": n8n con el flujo de Cortana (el usuario nunca lo ve)
  n8n:
    build: ./n8n
    image: cortana-n8n:1.0
    container_name: cortana-n8n
    restart: "no"
    env_file: .env
    depends_on:
      db-migrar:
        condition: service_completed_successfully
    environment:
      - GENERIC_TIMEZONE=${ZONA_HORARIA:-America/Caracas}
      - TZ=${ZONA_HORARIA:-America/Caracas}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:${PUERTO_N8N:-5679}/
    ports:
      # Panel de n8n solo para ti, el desarrollador (5679 para no chocar con otro n8n, como Zoe, que usa 5678)
      - "127.0.0.1:${PUERTO_N8N:-5679}:5678"
    volumes:
      - cortana_datos:/home/node/.n8n
      # El flujo se lee desde aquí: si lo cambias, basta con reiniciar Cortana
      - ./n8n/cortana.json:/cortana/cortana.json:ro
      - ./n8n/recordatorios.json:/cortana/recordatorios.json:ro
      # Los scripts de arranque también se leen desde la carpeta (así un arreglo no obliga a reconstruir)
      - ./n8n/arranque.sh:/cortana/arranque.sh:ro
      - ./n8n/preparar.js:/cortana/preparar.js:ro

  # La "memoria": base de datos con la agenda y el historial de conversaciones
  db:
    image: postgres:16-alpine
    container_name: cortana-db
    restart: "no"
    environment:
      - POSTGRES_DB=cortana
      - POSTGRES_USER=cortana
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      - TZ=${ZONA_HORARIA:-America/Caracas}
      - PGTZ=${ZONA_HORARIA:-America/Caracas}
    # Las fechas de la agenda se interpretan en la zona horaria del usuario
    command: ["postgres", "-c", "timezone=${ZONA_HORARIA:-America/Caracas}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortana -d cortana"]
      interval: 3s
      timeout: 3s
      retries: 30
    # Sin puertos publicados: solo n8n puede hablar con la base de datos
    volumes:
      - cortana_agenda:/var/lib/postgresql/data

  # Prepara o actualiza las tablas de la agenda en cada arranque y termina.
  # Es idempotente: si la tabla ya existe no la toca; si falta una columna nueva, la agrega.
  db-migrar:
    image: postgres:16-alpine
    container_name: cortana-db-migrar
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGPASSWORD=${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    command: ["psql", "-h", "db", "-U", "cortana", "-d", "cortana", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/esquema.sql"]
    volumes:
      - ./db/esquema.sql:/esquema.sql:ro

  # La "cara": la ventana de chat que ve el usuario
  web:
    image: nginx:1.27-alpine
    container_name: cortana-web
    restart: "no"
    depends_on:
      - n8n
    ports:
      - "127.0.0.1:${PUERTO_CORTANA:-8765}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  cortana_datos:
  cortana_agenda:
